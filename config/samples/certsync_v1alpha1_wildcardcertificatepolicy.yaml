# Discovers the hostnames the cluster routes, has cert-manager issue the
# wildcards that cover them, and keeps those synced into Azure Key Vault.
apiVersion: certsync.vileend.io/v1alpha1
kind: WildcardCertificatePolicy
metadata:
  name: public-sites
spec:
  # REQUIRED. Nothing outside these zones is ever issued. This is the boundary
  # that stops anyone who can create an Ingress from spending your Let's Encrypt
  # rate limit. Zones at or above a public suffix ("com", "co.uk") are rejected.
  zones:
  - x.com
  - sub.x.com

  # A ceiling on how many certificates may be planned. The overflow is reported
  # in status rather than issued.
  maxCertificates: 10

  discovery:
    ingress: true
    # Both Gateway API sources are only watched when the Gateway API CRDs are
    # installed at operator start; adding them later needs a restart.
    #
    # gateways is not redundant with httpRoutes. A route that leaves
    # spec.hostnames empty inherits whatever its listener allows, so with one
    # wildcard listener fronting many routes -- the usual Envoy Gateway shape --
    # the hostname exists only on the Gateway.
    httpRoutes: true
    gateways: true

  # PerZone issues one SAN certificate per zone, keeping the Application Gateway
  # listener, site and certificate counts low -- all three share a hard,
  # non-adjustable ceiling of 100.
  grouping: PerZone

  # Issues "*.x.com" whether or not the cluster routes anything under it yet.
  # Required by certificateNames below: a zone's certificate is named after its
  # own wildcard only while that SAN is covered, so without this the certificate
  # is renamed the first time discovery routes a name under the zone -- and the
  # sync retained under the old name keeps writing the pinned object.
  issueZoneWildcards: true

  # A wildcard matches exactly one label, so "*.x.com" does not cover "x.com".
  # Seeding the apex here rather than leaving it to discovery keeps an unrelated
  # Ingress from being load-bearing: delete the only object routing the apex and
  # the certificate is re-issued without that SAN, under the Key Vault object
  # name the gateway is already serving.
  issueZoneApex: true

  # The issuer is referenced, never created. It must be configured with a DNS-01
  # solver: wildcards cannot use HTTP-01.
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer

  certificateNamespace: cert-system

  keyVault:
    name: my-vault
    # certificateName is rejected here: a policy plans one certificate per zone,
    # so one name cannot apply to all of them. Pin them per zone instead.

  # Optional. Requires grouping: PerZone and issueZoneWildcards: true. Pins the
  # Key Vault object name a zone's certificate is imported into, for a gateway
  # whose listeners already name what they serve -- repointing a live listener
  # is a cutover. Unpinned zones keep the derived name, e.g. "*.x.com" becomes
  # "wildcard-x-com".
  #
  # Only the vault object moves. The cert-manager Certificate, its Secret and the
  # generated sync keep their derived names, because that is how this policy
  # recognises its own output.
  certificateNames:
    x.com: ingress-certificate

  # Retain leaves no-longer-required certificates in place. An Application
  # Gateway listener may still be serving one whose last Ingress just vanished.
  orphanPolicy: Retain
