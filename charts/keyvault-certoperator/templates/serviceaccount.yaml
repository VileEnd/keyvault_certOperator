{{- if .Values.serviceAccount.create }}
{{- if not .Values.azure.clientId }}
{{- fail "azure.clientId is required: set it to the client ID of the managed identity that holds Key Vault Certificates Officer on your vault" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keyvault-certoperator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
  annotations:
    {{- /* Changing this annotation needs a pod restart to take effect. */}}
    azure.workload.identity/client-id: {{ .Values.azure.clientId | quote }}
    {{- with .Values.azure.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
