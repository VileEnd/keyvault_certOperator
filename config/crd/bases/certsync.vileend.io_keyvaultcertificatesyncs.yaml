---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: keyvaultcertificatesyncs.certsync.vileend.io
spec:
  group: certsync.vileend.io
  names:
    categories:
    - certsync
    kind: KeyVaultCertificateSync
    listKind: KeyVaultCertificateSyncList
    plural: keyvaultcertificatesyncs
    shortNames:
    - kvcs
    singular: keyvaultcertificatesync
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.certificateName
      name: Vault Certificate
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.notAfter
      name: Not After
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeyVaultCertificateSync keeps one Kubernetes TLS Secret mirrored into one
          Azure Key Vault certificate, so an Application Gateway listener can serve it.

          Deleting this resource does not delete the Key Vault certificate. Application
          Gateway may still be serving it, and removing it would disable the listener.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KeyVaultCertificateSyncSpec describes one certificate to
              keep in Key Vault.
            properties:
              keyVault:
                description: KeyVault identifies the destination vault and certificate
                  object.
                properties:
                  certificateName:
                    description: |-
                      CertificateName is the Key Vault object name. Defaults to a value derived
                      from the certificate's subject alternative names.

                      The derivation replaces dots with hyphens, which is not reversible: both
                      "foo.example.com" and "foo-example.com" derive "foo-example-com". Set this
                      explicitly when that matters -- an Application Gateway listener references
                      the name, so a silent change would be an outage.

                      A WildcardCertificatePolicy rejects this field: it plans one certificate
                      per zone, so one name cannot apply to all of them. Pin the names there
                      with spec.certificateNames, which is keyed by zone.
                    pattern: ^[a-zA-Z][a-zA-Z0-9-]{0,126}$
                    type: string
                  cloud:
                    description: |-
                      Cloud selects the Azure environment when Name is used.

                      Left unset it follows the operator's --azure-cloud, which is the cloud
                      the operator's own identity lives in and is almost always the right
                      answer. It is deliberately not defaulted by the API server: a default
                      materialised into every stored object would silently override that flag,
                      so a sovereign-cloud deployment would have to repeat the cloud on every
                      resource to work at all.
                    enum:
                    - AzurePublicCloud
                    - AzureUSGovernmentCloud
                    - AzureChinaCloud
                    type: string
                  name:
                    description: |-
                      Name is the Key Vault's short name, resolved against Cloud. Mutually
                      exclusive with VaultURL.
                    maxLength: 24
                    minLength: 3
                    type: string
                  vaultURL:
                    description: |-
                      VaultURL is the vault's full base URL. Use this for sovereign clouds or a
                      private endpoint. Mutually exclusive with Name.
                    pattern: ^https://.+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or vaultURL must be set
                  rule: has(self.name) != has(self.vaultURL)
              source:
                description: Source selects the certificate to sync.
                properties:
                  secretRef:
                    description: SecretRef names the kubernetes.io/tls Secret holding
                      tls.crt and tls.key.
                    properties:
                      name:
                        description: Name is the Secret's name. It must be of type
                          kubernetes.io/tls.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              syncPolicy:
                description: SyncPolicy tunes resync cadence and archive format.
                properties:
                  pkcs12Profile:
                    default: legacy
                    description: PKCS12Profile selects the archive format sent to
                      Key Vault.
                    enum:
                    - legacy
                    - passwordless
                    - modern
                    type: string
                  resyncInterval:
                    default: 1h
                    description: |-
                      ResyncInterval is how often to re-check Key Vault even without a change in
                      the cluster, catching drift applied out of band. Defaults to one hour.
                    type: string
                type: object
            required:
            - keyVault
            - source
            type: object
          status:
            description: KeyVaultCertificateSyncStatus reports the observed state
              of one sync.
            properties:
              certificateName:
                description: |-
                  CertificateName is the Key Vault object name actually used, whether taken
                  from the spec or derived.
                type: string
              chainDigest:
                description: |-
                  ChainDigest covers the leaf and its full chain. The thumbprint alone
                  cannot detect a CA rotating its intermediates, which leaves the leaf
                  byte-identical while the stored chain goes stale.
                type: string
              conditions:
                description: Conditions holds Ready and Synced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dnsNames:
                description: DNSNames are the subject alternative names on the synced
                  certificate.
                items:
                  type: string
                maxItems: 100
                type: array
              lastSyncTime:
                description: LastSyncTime is when the sync last completed successfully.
                format: date-time
                type: string
              lastSyncedThumbprint:
                description: LastSyncedThumbprint is the SHA-1 of the leaf, matching
                  Key Vault's x5t.
                type: string
              notAfter:
                description: NotAfter is the leaf's expiry.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              secretIdentifier:
                description: |-
                  SecretIdentifier is the *versionless* Key Vault secret URI to configure on
                  the Application Gateway listener.

                  It is versionless on purpose. Application Gateway polls this URI roughly
                  every four hours and rotates to any newer version it finds; a versioned URI
                  pins the listener to one version and silently disables that rotation.
                type: string
              vaultCertificateVersion:
                description: VaultCertificateVersion is the version created by the
                  most recent import.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
