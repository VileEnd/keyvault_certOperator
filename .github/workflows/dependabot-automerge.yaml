name: Dependabot auto-merge

# Dependency updates sat open for two months because merging each one was a
# manual step. This asks GitHub to merge a patch or minor update by itself once
# the required checks pass; branch protection is what makes "once they pass"
# mean anything. A major bump is a decision, so it still waits for a person.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
