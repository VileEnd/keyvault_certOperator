{{- if and .Values.metrics.enabled .Values.metrics.service.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keyvault-certoperator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
spec:
  ports:
  - name: metrics
    port: {{ .Values.metrics.port }}
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "keyvault-certoperator.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "keyvault-certoperator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "keyvault-certoperator.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: metrics
    scheme: https
    interval: {{ .Values.metrics.serviceMonitor.interval }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      insecureSkipVerify: true
{{- end }}
