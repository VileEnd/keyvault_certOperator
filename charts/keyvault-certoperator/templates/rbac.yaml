apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keyvault-certoperator.fullname" . }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
# The rules come from templates/_rbac-rules.tpl, which "make helm-rbac"
# generates from the +kubebuilder:rbac markers. They are not written here,
# because a hand-maintained second copy is what once left the chart without
# permission to list Gateways while the operator was watching them.
#
# What the markers grant, in short: Secrets are read-only -- the operator never
# creates, updates or deletes one, and its cache is further restricted to
# Secrets carrying certsync.vileend.io/managed=true, so unrelated private keys
# never enter memory. Only cert-manager Certificates and this operator's own
# resources are writable.
rules:
{{- include "keyvault-certoperator.managerRules" . | nindent 0 }}
{{- if .Values.metrics.enabled }}
{{- include "keyvault-certoperator.metricsAuthRules" . | nindent 0 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "keyvault-certoperator.fullname" . }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "keyvault-certoperator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "keyvault-certoperator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "keyvault-certoperator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
rules:
{{- include "keyvault-certoperator.leaderElectionRules" . | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "keyvault-certoperator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyvault-certoperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "keyvault-certoperator.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "keyvault-certoperator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
