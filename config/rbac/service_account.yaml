apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager
  namespace: system
  annotations:
    # Replace with the client ID of the user-assigned managed identity that has
    # "Key Vault Certificates Officer" on the target vault, and create a
    # federated credential whose subject is
    #   system:serviceaccount:<namespace>:keyvault-certoperator-controller-manager
    # Changing this annotation requires a pod restart to take effect.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
