apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: wildcardcertificatepolicies.certsync.vileend.io
spec:
  group: certsync.vileend.io
  names:
    categories:
    - certsync
    kind: WildcardCertificatePolicy
    listKind: WildcardCertificatePolicyList
    plural: wildcardcertificatepolicies
    shortNames:
    - wcp
    singular: wildcardcertificatepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zones
      name: Zones
      type: string
    - jsonPath: .status.requiredCertificateCount
      name: Certificates
      type: integer
    - jsonPath: .status.discoveredHosts
      name: Hosts
      priority: 1
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WildcardCertificatePolicy discovers the hostnames the cluster routes, decides
          which wildcard certificates cover them, has cert-manager issue those, and
          keeps them synced into Azure Key Vault.

          It exists because Application Gateway's per-gateway limits -- 100 backend
          pools, 100 backend HTTP settings, 100 active listeners, 100 SSL certificates,
          all hard -- make one listener per service unworkable past roughly a hundred
          applications. A handful of wildcard certificates uses a few percent of those
          budgets no matter how many services sit behind the in-cluster proxy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WildcardCertificatePolicySpec describes which wildcards the
              cluster needs.
            properties:
              certificateNamespace:
                description: |-
                  CertificateNamespace is where the cert-manager Certificate resources, the
                  resulting Secrets and the generated sync resources are created.
                minLength: 1
                type: string
              discovery:
                description: Discovery selects the sources of hostnames.
                properties:
                  gateways:
                    description: |-
                      Gateways enables discovery from the hostnames declared on Gateway API
                      Gateway listeners.

                      This is not redundant with HTTPRoutes. A route whose spec.hostnames is
                      empty inherits the hostnames its listener allows, so with a wildcard
                      listener -- the common shape behind Envoy Gateway -- the hostname exists
                      only on the Gateway and reading routes alone would discover nothing.

                      Listener protocol is deliberately ignored. A listener may terminate plain
                      HTTP because TLS is already terminated upstream at Application Gateway,
                      which is exactly the topology this operator serves; the hostname is still
                      a hostname the cluster routes.

                      Unset means "use it when available". Setting it explicitly to true states
                      a requirement: pruning is then withheld if the CRDs were absent at
                      startup, because the discovered set would be incomplete.
                    type: boolean
                  httpRoutes:
                    description: |-
                      HTTPRoutes enables discovery from Gateway API HTTPRoute resources.

                      The watch can only be established if the Gateway API CRDs are present when
                      the operator starts, so installing Gateway API later requires a restart.

                      Unset means "use it when available". Setting it explicitly to true states
                      a requirement: pruning is then withheld if the CRDs were absent at
                      startup, because the discovered set would be incomplete.
                    type: boolean
                  ingress:
                    description: |-
                      Ingress enables discovery from networking.k8s.io Ingress resources.

                      Unset means "use this source when it is available", which is the default
                      behaviour. It is deliberately left unset rather than defaulted to true:
                      structural defaulting would materialise the value into every stored
                      object, erasing the difference between a source the user required and one
                      they never mentioned.
                    type: boolean
                  namespaceSelector:
                    description: |-
                      NamespaceSelector narrows discovery to matching namespaces. Empty means
                      all namespaces.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              grouping:
                default: PerZone
                description: Grouping selects how SANs are packed into certificates.
                enum:
                - PerZone
                - PerWildcard
                type: string
              issueZoneWildcards:
                default: false
                description: |-
                  IssueZoneWildcards issues "*.<zone>" for every zone in Zones, whether or
                  not anything in the cluster routes a name under it.

                  Discovery answers "what does the cluster route today", which is empty
                  before the first workload exists -- and an Application Gateway listener
                  cannot reference a Key Vault certificate that does not exist yet, so a
                  new zone is otherwise a chicken-and-egg problem. Set this when the
                  gateway must serve a zone's wildcard regardless of what is deployed
                  behind it.

                  The seeded names pass the same zone allowlist, public-suffix check and
                  certificate cap as a discovered one.
                type: boolean
              issuerRef:
                description: |-
                  IssuerRef names the cert-manager issuer used for DNS-01.

                  Wildcards cannot use HTTP-01, so the issuer must be configured with a
                  DNS-01 solver. DNS-01 never touches the cluster, which is why no pod,
                  Service or Ingress is needed to satisfy the challenge.
                properties:
                  group:
                    default: cert-manager.io
                    description: Group of the issuer.
                    type: string
                  kind:
                    default: ClusterIssuer
                    description: Kind of the issuer.
                    enum:
                    - Issuer
                    - ClusterIssuer
                    type: string
                  name:
                    description: Name of the issuer.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              keyVault:
                description: KeyVault identifies the destination vault.
                properties:
                  certificateName:
                    description: |-
                      CertificateName is the Key Vault object name. Defaults to a value derived
                      from the certificate's subject alternative names.

                      The derivation replaces dots with hyphens, which is not reversible: both
                      "foo.example.com" and "foo-example.com" derive "foo-example-com". Set this
                      explicitly when that matters -- an Application Gateway listener references
                      the name, so a silent change would be an outage.
                    pattern: ^[a-zA-Z][a-zA-Z0-9-]{0,126}$
                    type: string
                  cloud:
                    description: |-
                      Cloud selects the Azure environment when Name is used.

                      Left unset it follows the operator's --azure-cloud, which is the cloud
                      the operator's own identity lives in and is almost always the right
                      answer. It is deliberately not defaulted by the API server: a default
                      materialised into every stored object would silently override that flag,
                      so a sovereign-cloud deployment would have to repeat the cloud on every
                      resource to work at all.
                    enum:
                    - AzurePublicCloud
                    - AzureUSGovernmentCloud
                    - AzureChinaCloud
                    type: string
                  name:
                    description: |-
                      Name is the Key Vault's short name, resolved against Cloud. Mutually
                      exclusive with VaultURL.
                    maxLength: 24
                    minLength: 3
                    type: string
                  vaultURL:
                    description: |-
                      VaultURL is the vault's full base URL. Use this for sovereign clouds or a
                      private endpoint. Mutually exclusive with Name.
                    pattern: ^https://.+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or vaultURL must be set
                  rule: has(self.name) != has(self.vaultURL)
              maxCertificates:
                default: 10
                description: |-
                  MaxCertificates caps how many certificates may be planned. The overflow is
                  reported in status rather than issued.

                  At the cap, certificates that already exist keep their slot and the new
                  one overflows. The alternative -- planning the first N by name -- means
                  adding a zone that sorts early evicts an unrelated certificate, and under
                  orphanPolicy: Prune, out of the plan means deleted.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              orphanPolicy:
                default: Retain
                description: |-
                  OrphanPolicy decides what happens to no-longer-required certificates.

                  Prune is guarded: pruning is judged against the current discovery pass, so
                  the operator withholds it when that pass planned nothing at all, or when a
                  source the policy explicitly enabled was unavailable at startup. Either
                  case is reported as PruneWithheld rather than acted on, because deleting a
                  generated Certificate destroys the issued Secret. Setting
                  IssueZoneWildcards removes the empty-pass case by making the plan
                  independent of discovery.
                enum:
                - Retain
                - Prune
                type: string
              syncPolicy:
                description: SyncPolicy is applied to every generated sync resource.
                properties:
                  pkcs12Profile:
                    default: legacy
                    description: PKCS12Profile selects the archive format sent to
                      Key Vault.
                    enum:
                    - legacy
                    - passwordless
                    - modern
                    type: string
                  resyncInterval:
                    default: 1h
                    description: |-
                      ResyncInterval is how often to re-check Key Vault even without a change in
                      the cluster, catching drift applied out of band. Defaults to one hour.
                    type: string
                type: object
              zones:
                description: |-
                  Zones is the allowlist of DNS zones issuance may happen inside. It is
                  required and has no permissive default.

                  This is the primary safety boundary. Discovery reacts to Ingress and
                  HTTPRoute resources, so without an allowlist anyone able to create one
                  could trigger ACME issuance and spend the cluster's Let's Encrypt rate
                  limit for a registered domain. Zones at or above a public suffix are
                  rejected, so "*.com" is unreachable by construction.
                items:
                  type: string
                maxItems: 50
                minItems: 1
                type: array
            required:
            - certificateNamespace
            - issuerRef
            - keyVault
            - zones
            type: object
          status:
            description: WildcardCertificatePolicyStatus reports the observed state
              of discovery.
            properties:
              applicationGateway:
                description: ApplicationGateway is the listener configuration to apply
                  out of band.
                properties:
                  listenerCount:
                    description: |-
                      ListenerCount is how many listeners the plan actually needs.

                      Worth reading rather than counting the list above: Application Gateway
                      allows 100 active listeners per gateway, hard, so a count above 100 does
                      not merely mean this report was truncated -- it means the plan does not
                      fit on one gateway.
                    format: int32
                    type: integer
                  listeners:
                    description: |-
                      Listeners is the set of listeners needed to serve every planned
                      certificate, truncated to 100. ListenerCount reports the true total.
                    items:
                      description: ListenerGuidance is a ready-to-apply Application
                        Gateway listener.
                      properties:
                        hostnames:
                          description: |-
                            Hostnames for one multi-site listener. Application Gateway allows at most
                            five per listener, so a certificate with more SANs than that yields
                            several entries here.
                          items:
                            type: string
                          maxItems: 5
                          type: array
                        keyVaultSecretID:
                          description: |-
                            KeyVaultSecretID is the versionless secret identifier to configure. Using
                            a versioned one would permanently disable automatic rotation.
                          type: string
                      required:
                      - hostnames
                      - keyVaultSecretID
                      type: object
                    maxItems: 100
                    type: array
                type: object
              conditions:
                description: Conditions holds Ready, Discovered and CertManagerAvailable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discoveredHosts:
                description: |-
                  DiscoveredHosts counts the hostnames found. It is a count rather than a
                  list because a large cluster would otherwise put an unbounded value into
                  etcd.
                format: int32
                type: integer
              lastDiscoveryTime:
                description: LastDiscoveryTime is when discovery last completed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              requiredCertificateCount:
                description: RequiredCertificateCount is how many certificates the
                  plan contains.
                format: int32
                type: integer
              requiredCertificates:
                description: |-
                  RequiredCertificates is the planned certificate set. It is bounded by
                  spec.maxCertificates, which the API server caps at 100.
                items:
                  description: PlannedCertificate is one certificate discovery decided
                    the cluster needs.
                  properties:
                    dnsNames:
                      description: |-
                        DNSNames are the subject alternative names it must carry, truncated to
                        the first 100. The issued Certificate always carries the full set; only
                        this report is bounded, because an unbounded status field would put every
                        SAN of every certificate into etcd on every reconcile.
                      items:
                        type: string
                      maxItems: 100
                      type: array
                    name:
                      description: Name is the cert-manager Certificate and Key Vault
                        certificate name.
                      type: string
                    secretIdentifier:
                      description: SecretIdentifier is the versionless Key Vault URI
                        for the listener.
                      type: string
                    secretName:
                      description: SecretName is the Secret cert-manager writes.
                      type: string
                    zone:
                      description: Zone is the allowlisted zone it was planned under.
                      type: string
                  required:
                  - dnsNames
                  - name
                  - secretIdentifier
                  - secretName
                  - zone
                  type: object
                maxItems: 100
                type: array
              skippedHostCount:
                description: SkippedHostCount is the total number of skipped hostnames.
                format: int32
                type: integer
              skippedHosts:
                description: |-
                  SkippedHosts lists hostnames that were not covered, with reasons. It is
                  truncated to a bounded sample; SkippedHostCount reports the true total.
                items:
                  description: SkippedHost records a discovered hostname that was
                    deliberately not covered.
                  properties:
                    host:
                      description: Host is the hostname.
                      type: string
