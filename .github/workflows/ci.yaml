name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with the go directive in go.mod. The toolchain directive fetches
  # a newer one automatically if the module needs it.
  GO_VERSION: "1.26"

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # The end-to-end suite is behind a build tag, so vet it explicitly.
      - run: go vet -tags e2e ./test/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Installed from the version pinned in the Makefile rather than a
      # third-party action, so CI and a developer machine run the same linter.
      - run: make lint

  test:
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: make test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Fails if the CRDs, RBAC or deepcopy code drift from the Go markers, or if
      # the chart's copy of the CRDs is stale.
      - run: make check-manifests
      - run: make check-helm-crds

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Helm
        run: go install helm.sh/helm/v3/cmd/helm@v3.19.0
      - name: Lint and render
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          helm lint charts/keyvault-certoperator --set azure.clientId=00000000-0000-0000-0000-000000000000
          helm template ci charts/keyvault-certoperator \
            --set azure.clientId=00000000-0000-0000-0000-000000000000 > /dev/null
          helm template ci charts/keyvault-certoperator \
            --set azure.clientId=00000000-0000-0000-0000-000000000000 \
            --set metrics.enabled=true \
            --set metrics.service.create=true \
            --set metrics.serviceMonitor.enabled=true \
            --set watchNamespaces="{cert-system}" > /dev/null
      - name: Refuse to render without an identity
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          if helm template ci charts/keyvault-certoperator > /dev/null 2>&1; then
            echo "the chart rendered without azure.clientId; the guard is broken"
            exit 1
          fi

  e2e:
    name: End-to-end (k3s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | sudo sh -s - \
            --disable traefik --disable metrics-server --disable local-storage \
            --disable servicelb --write-kubeconfig-mode 644
      - name: Wait for the node to be ready
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          for _ in $(seq 1 60); do
            if kubectl get nodes 2>/dev/null | grep -q ' Ready '; then break; fi
            sleep 5
          done
          kubectl get nodes
      # Warm the module cache as the normal user so the sudo'd build is quick.
      - name: Prime the build
        run: go build ./cmd/manager
      # Root is required: the fake Key Vault binds port 443 under a real
      # *.vault.azure.net name, so the SDK's challenge-resource verification is
      # exercised rather than switched off. It also writes /etc/hosts.
      - name: Run the end-to-end suite
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" \
            "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
            test/e2e/run.sh 2>&1 | tee e2e.log
      # Asserted by name rather than by "no skips": a skip would otherwise look
      # exactly like a pass and quietly remove the only coverage of RBAC
      # sufficiency and the Azure wire protocol. The cert-manager test is
      # expected to skip here; it has its own job.
      - name: Assert the suite ran
        run: |
          grep -q -- "--- PASS: TestOperatorSyncsACertificateIntoKeyVault" e2e.log
          grep -q -- "--- PASS: TestOperatorDiscoversHostsAndRequestsCertificates" e2e.log
      - name: Dump diagnostics on failure
        if: failure()
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl get keyvaultcertificatesyncs -A -o yaml || true
          kubectl get wildcardcertificatepolicies -A -o yaml || true
          sudo journalctl -u k3s --no-pager -n 100 || true

  e2e-fullstack:
    name: End-to-end with cert-manager issuing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | sudo sh -s - \
            --disable traefik --disable metrics-server --disable local-storage \
            --disable servicelb --write-kubeconfig-mode 644
      - name: Wait for the node to be ready
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          for _ in $(seq 1 60); do
            if kubectl get nodes 2>/dev/null | grep -q ' Ready '; then break; fi
            sleep 5
          done
          kubectl get nodes
      - name: Prime the build
        run: go build ./cmd/manager
      # The whole pipeline: the policy plans a wildcard, the operator asks
      # cert-manager for it, cert-manager genuinely issues it, and the operator
      # imports the result into the mock Key Vault. Nothing hand-writes the
      # Secret here -- cert-manager does.
      - name: Run the end-to-end suite with cert-manager
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" \
            "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml E2E_CERT_MANAGER=1 \
            test/e2e/run.sh 2>&1 | tee e2e-fullstack.log
      - name: Assert cert-manager actually issued and the operator synced it
        run: |
          if grep -q -- "--- SKIP: TestCertManagerIssuesAndTheOperatorSyncsItToKeyVault" e2e-fullstack.log; then
            echo "the cert-manager test skipped; cert-manager was expected to be installed"
            exit 1
          fi
          grep -q -- "--- PASS: TestCertManagerIssuesAndTheOperatorSyncsItToKeyVault" e2e-fullstack.log
      - name: Dump diagnostics on failure
        if: failure()
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl get certificates.cert-manager.io -A -o wide || true
          kubectl get certificaterequests.cert-manager.io -A -o wide || true
          kubectl describe certificates.cert-manager.io -n e2e-certs || true
          kubectl get keyvaultcertificatesyncs -A -o yaml || true
          kubectl logs -n cert-manager deployment/cert-manager --tail=100 || true

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain docker build: the runner already has Docker, and this keeps the
      # gate free of third-party actions.
      - run: docker build -t keyvault-certoperator:ci .

  deploy:
    name: Deploys and runs in-cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build the image
        run: docker build -t keyvault-certoperator:ci .
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | sudo sh -s - \
            --disable traefik --disable metrics-server --disable local-storage \
            --disable servicelb --write-kubeconfig-mode 644
      - name: Wait for the node to be ready
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          for _ in $(seq 1 60); do
            if kubectl get nodes 2>/dev/null | grep -q ' Ready '; then break; fi
            sleep 5
          done
      - name: Load the image into k3s
        run: docker save keyvault-certoperator:ci | sudo k3s ctr images import -
      - name: Install Helm
        run: go install helm.sh/helm/v3/cmd/helm@v3.19.0
      # The Azure Workload Identity webhook is not installed on this cluster, so
      # the AZURE_* variables it would inject are supplied by hand. The
      # credential constructor only checks that they are present -- it never
      # reads the token file -- so this reproduces production startup exactly
      # without any Azure being reachable.
      - name: Install the chart
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          helm upgrade --install keyvault-certoperator ./charts/keyvault-certoperator \
            --namespace keyvault-certoperator-system --create-namespace \
            --set image.repository=keyvault-certoperator \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set azure.clientId=00000000-0000-0000-0000-000000000000 \
            --set 'extraEnv[0].name=AZURE_CLIENT_ID' \
            --set 'extraEnv[0].value=00000000-0000-0000-0000-000000000000' \
            --set 'extraEnv[1].name=AZURE_TENANT_ID' \
            --set 'extraEnv[1].value=11111111-1111-1111-1111-111111111111' \
            --set 'extraEnv[2].name=AZURE_FEDERATED_TOKEN_FILE' \
            --set 'extraEnv[2].value=/var/run/secrets/azure/tokens/azure-identity-token' \
            --wait --timeout 5m
      # The operator has no Azure to reach here, and that is the point: neither
      # probe may depend on Key Vault. If they did, an Azure outage would turn
      # into a CrashLoopBackOff and cost the operator its leader election.
      - name: Assert it becomes ready without any Azure reachable
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl rollout status -n keyvault-certoperator-system \
            deployment/keyvault-certoperator --timeout=5m
          kubectl get pods -n keyvault-certoperator-system -o wide
      - name: Assert the hardened pod spec is actually in effect
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          pod=$(kubectl get pods -n keyvault-certoperator-system \
            -l app.kubernetes.io/name=keyvault-certoperator -o name | head -1)
          echo "inspecting $pod"
          test "$(kubectl get -n keyvault-certoperator-system "$pod" \
            -o jsonpath='{.spec.securityContext.runAsNonRoot}')" = "true"
          test "$(kubectl get -n keyvault-certoperator-system "$pod" \
            -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}')" = "true"
          test "$(kubectl get -n keyvault-certoperator-system "$pod" \
            -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}')" = "false"
          # Required by Azure Workload Identity; without it the webhook skips the
          # pod and the operator fails on its next restart rather than at deploy.
          test "$(kubectl get -n keyvault-certoperator-system "$pod" \
            -o jsonpath='{.metadata.labels.azure\.workload\.identity/use}')" = "true"
      - name: Dump diagnostics on failure
        if: failure()
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl describe deployment -n keyvault-certoperator-system keyvault-certoperator || true
          kubectl describe pods -n keyvault-certoperator-system || true
          kubectl logs -n keyvault-certoperator-system \
            -l app.kubernetes.io/name=keyvault-certoperator --tail=200 || true
