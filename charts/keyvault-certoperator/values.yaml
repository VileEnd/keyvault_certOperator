# The CustomResourceDefinitions ship in templates/ rather than crds/, so that
# "helm upgrade" actually updates them -- Helm installs a crds/ directory once
# and never touches it again, with no flag to change that.
crds:
  # Install the CRDs with the chart. Turn this off where a platform team or
  # GitOps controller owns cluster-scoped resources; the operator still needs
  # them to exist.
  enabled: true
  # Keep the CRDs when the release is uninstalled. Deleting a CRD deletes every
  # custom resource of that kind, so "helm uninstall" would otherwise take every
  # WildcardCertificatePolicy and KeyVaultCertificateSync with it. Leave this on
  # unless you are certain you want that.
  keep: true

image:
  repository: ghcr.io/vileend/keyvault-certoperator
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

azure:
  # Client ID of the user-assigned managed identity holding
  # "Key Vault Certificates Officer" on the target vault. Required.
  clientId: ""
  # Tenant ID. Optional: the workload identity webhook supplies a default.
  tenantId: ""
  # workload-identity (default) or default. Use "default" only for local
  # development against a real vault; it enables the full credential chain.
  credentialMode: workload-identity
  # Key Vault names or base URLs this operator may write to.
  #
  # Set this to the same vault the managed identity was granted. Without it the
  # vault is chosen entirely by whoever writes the custom resource, and a
  # resource naming another vault produces a 403 the operator treats as
  # retryable -- so it backs off forever against something that will never fix
  # itself. With it, that resource fails immediately as ConfigInvalid.
  #
  # Empty permits any vault the identity has rights on, which is the behaviour
  # that existed before this value.
  #
  #   allowedVaults: ["my-vault"]
  allowedVaults: []

  # Which existing Key Vault certificates a sync may import over.
  #
  # The certificate name is chosen by whoever writes the resource, and a
  # listener serves whatever is stored under the name it was given.
  #
  #   adopt-untagged  Refuse a certificate this operator synced from a different
  #                   Secret; still take over one it never touched (default).
  #   strict          Also refuse certificates it never touched. Use this once
  #                   every certificate in the vault is operator-managed.
  #   off             No check.
  vaultOwnership: adopt-untagged

  # The Azure cloud this operator's identity lives in. It resolves every bare
  # Key Vault name -- in allowedVaults above and in any resource that does not
  # name a cloud of its own -- so a sovereign-cloud deployment sets it once here
  # rather than repeating it on every resource.
  #
  # One of AzureChinaCloud, AzurePublicCloud, AzureUSGovernmentCloud.
  cloud: AzurePublicCloud

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Restrict the operator to specific namespaces. Empty means all namespaces.
watchNamespaces: []

leaderElection:
  enabled: true

metrics:
  # Disabled by default. When enabled the endpoint is served over HTTPS and
  # gated by TokenReview and SubjectAccessReview.
  enabled: false
  port: 8443
  service:
    create: false
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Alert rules for the Prometheus Operator. They need the metrics to be
  # scraped, so enable the Service and ServiceMonitor above as well (or scrape
  # the endpoint some other way).
  prometheusRule:
    enabled: false
    labels: {}
    # Warn and page this long before a synced certificate expires. A renewal
    # normally lands a month ahead, so reaching either means it is not arriving.
    expiryWarningDays: 14
    expiryCriticalDays: 3
    # Fire when a resource has not synced successfully for this many seconds.
    # Keep it comfortably above the largest syncPolicy.resyncInterval in use
    # (default 1h).
    staleAfterSeconds: 10800

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

# The defaults below satisfy the restricted Pod Security Standard. Weakening
# them is visible in review, which is the point of spelling them out.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

logging:
  # Set to true for human-readable logs during development.
  development: false

# Extra environment variables for the manager container. Useful for a proxy, a
# custom CA bundle via SSL_CERT_FILE, or AZURE_AUTHORITY_HOST in a sovereign
# cloud. Normally leave empty: the workload identity webhook injects the AZURE_*
# variables itself.
extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy.internal:3128

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
priorityClassName: ""
